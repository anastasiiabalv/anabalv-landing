name: Test Project

on:
  pull_request:
    branches:
      - main

permissions: 
  contents: read

jobs:
  test: 
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'npm'
          
      - name: Install dependencies
        run: npm ci
        
      - name: Run Linter
        run: npx eslint .
        continue-on-error: false
        
      - name: Build Application
        run: npm run build
        env:
          NUXT_PUBLIC_API_BASE: ${{ secrets.NUXT_PUBLIC_API_BASE }}
          NUXT_API_SECRET: ${{ secrets.NUXT_API_SECRET }}

      - name: Install Playwright Browsers
        run: npx playwright install chromium --with-deps

      - name: Run App and Check Hydration
        run: npx playwright test test/e2e/hydration.spec.ts
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESEND_MAIL: ${{ secrets.RESEND_MAIL }}
