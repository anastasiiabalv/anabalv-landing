name: Test Project

on:
  pull_request:
    branches:
      - main

permissions: 
  contents: read

jobs:
  test: 
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        persist-credentials: false  
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
      - run: npm ci
      - run: npx eslint .
        continue-on-error: false
      - run: npm run build